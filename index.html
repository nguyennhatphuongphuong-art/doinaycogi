function money(n){return Math.max(0,Math.round(Number(n)||0)).toLocaleString('vi-VN')+'đ'}
function clamp(n){return Math.max(0,Math.min(100,Number(n)||0))}
function clock(){return String(state.hour).padStart(2,'0')+':'+String(state.minute).padStart(2,'0')}
function addTime(h){var m=Math.round(h*60);state.minute+=m;state.hour+=Math.floor(state.minute/60);state.minute%=60;if(state.hour>=24){state.hour-=24;state.day++;state.energy=clamp(state.energy+55);state.health=clamp(state.health-2)}}
function save(){try{localStorage.setItem('DNCSV_NEW_HOST_1_2',JSON.stringify(state))}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem('DNCSV_NEW_HOST_1_2'));if(x&&typeof x==='object'){state=Object.assign(state,x);state.inventory=Array.isArray(x.inventory)?x.inventory:[]}}catch(e){}}
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){toastEl.classList.remove('show')},1800)}
function hud(){return '<div class="hud"><div class="stat"><div class="label">💰 Tiền</div><b>'+money(state.money)+'</b></div><div class="stat"><div class="label">❤️ Sức khỏe</div><b>'+state.health+'/100</b><div class="bar"><i style="width:'+state.health+'%"></i></div></div><div class="stat"><div class="label">⚡ Năng lượng</div><b>'+state.energy+'/100</b><div class="bar"><i style="width:'+state.energy+'%"></i></div></div></div>'}

function schoolTravel(){return '<main class="screen travel"><div class="homeHead"><div class="title" style="font-size:22px">Đang đi học</div><div class="sub">🏫 Tới trường · '+(state.travel&&state.travel.transport==='bike'?'Xe đạp · 00:40':'Đi bộ · 01:00')+'</div></div><div class="scene"><img class="bg" src="'+img.street+'"><div class="shade"></div><div class="tag">🌆 ĐƯỜNG PHỐ → 🏫 TRƯỜNG</div><img class="player" style="height:145px;bottom:95px" src="'+img.walk+'"><div class="bubble"><b>BUỔI SÁNG</b>Đường tới trường cũng là một phần của cuộc sống.</div></div><section class="section"><div class="progress"><i id="travelProgress"></i></div><div class="muted">NPC, xe cộ và micro-event có thể xuất hiện.</div><div class="grid2" style="margin-top:8px"><button class="btn bad" data-act="cancelTravel">HỦY</button><button class="btn" data-act="skipSchool">Đến trường</button></div></section></main>'}
var steps={pho:[['NHẬN ORDER','Khách vừa gọi món.'],['LÀM MÓN','Bếp đang chuẩn bị phở bò + quẩy.'],['MANG MÓN','Món đã xong. Mang ra đúng bàn.'],['GIAO MÓN','Đặt đúng món trước mặt khách.'],['DỌN BÀN','Khách ăn xong. Dọn bàn sạch.'],['THU TIỀN','Thu tiền. Chỉ bước này mới cộng tiền.']],office:[['NHẬN TASK','Nhận task từ công ty.'],['LÀM VIỆC','Xử lý dữ liệu và trả lời mail.'],['CHECK','Tự kiểm tra trước khi gửi.'],['SUBMIT','Nộp task cho quản lý.'],['NHẬN LƯƠNG','Nhận tiền ở bước cuối.']],shipper:[['NHẬN ĐƠN','Nhận đơn mới.'],['LẤY HÀNG','Lấy hàng tại quán.'],['ĐI GIAO','Tự động di chuyển tới khách.'],['GIAO HÀNG','Giao đúng người, đúng địa chỉ.'],['XÁC NHẬN','Xác nhận hoàn tất.']]};
function jobScreen(){var k=state.jobRun.kind;var map=k==='pho'?img.pho:k==='office'?img.office:img.shipper;var art=k==='pho'?img.phoWork:k==='office'?img.officeWork:img.delivery;var s=steps[k][state.jobRun.step];var npc=k==='pho'?img.khach:k==='office'?img.khoa:img.huong;var npcName=k==='pho'?'Khách bàn 3':k==='office'?'Khoa · đồng nghiệp':'Khách nhận hàng';var line=k==='pho'?(state.jobRun.step<4?'“Em ơi, bàn này đang chờ món.”':'“Bao nhiêu tiền em?”'):k==='office'?'“Task này đơn giản thôi… chắc vậy.”':'“Anh giao tới cửa giúp em nhé.”';return '<main class="screen"><div class="homeHead"><div class="title" style="font-size:22px">'+(k==='pho'?'🍜 Quán phở':k==='office'?'🧑‍💻 Văn phòng':'🛵 Khu shipper')+'</div><div class="sub">Bước '+(state.jobRun.step+1)+' / '+steps[k].length+' · '+s[0]+'</div></div><div class="scene"><img class="bg" src="'+map+'"><div class="shade"></div><div class="tag">'+s[0]+'</div><img class="worldNpc right" src="'+npc+'"><div class="npcName" style="right:10%;bottom:178px;transform:none">'+npcName+'</div><div class="npcBubble" style="right:15%;bottom:194px"><b>'+npcName+'</b><br>'+line+'</div><img class="player" style="height:150px" src="'+art+'"><div class="bubble"><b>'+s[0]+'</b>'+s[1]+'</div></div><section class="section"><div class="muted">'+(k==='pho'?'Order #101 · Phở bò + quẩy · Bàn 3':k==='office'?'Task #204 · Nhập dữ liệu · Deadline 17:30':'Đơn #782 · Chung cư A · Tầng 7')+'</div><div class="progress"><i id="jobProgress" style="width:'+(state.jobRun.progress||0)+'%"></i></div><div class="step"><b>'+s[0]+'</b><span class="travelPulse">'+(state.jobRun.running?'Đang thực hiện…':'Sẵn sàng')+'</span></div><div class="grid2" style="margin-top:8px"><button class="btn primary" data-act="jobDo">'+(state.jobRun.running?'ĐANG LÀM…':'▶ '+s[0])+'</button><button class="btn bad" data-act="cancelJob">HỦY</button></div><div class="jobNpcRow"><img src="'+npc+'"><div><b>'+npcName+'</b><span>'+line+'</span></div></div><div class="muted" style="margin-top:8px">Mỗi lần bấm là một hành động thật trong chuỗi công việc. Không cần điều khiển nhân vật.</div></section></main>'}
function shop(){var items=[['👕','Áo thun','80.000đ','shirt'],['📱','Điện thoại mới','1.500.000đ','phone2'],['💻','Laptop cũ','4.000.000đ','laptop'],['🎒','Ba lô','150.000đ','bag'],['🚲','Xe đạp','1.200.000đ','bike'],['🧊','Tủ lạnh','4.000.000đ','fridge']];return '<main class="simplePage"><div class="pageHead"><div><b>🛒 Cửa hàng</b><div class="sub">Mua đồ để mở nội dung hoặc mua lại thời gian.</div></div><button class="btn" data-nav="phone">Đóng</button></div>'+items.map(function(i){var owned=state.inventory.indexOf(i[3])>=0;return '<div class="card"><div class="step"><div><b>'+i[0]+' '+i[1]+'</b><div class="muted">'+i[2]+'</div></div><button class="btn '+(owned?'good':'primary')+'" data-buy="'+i[3]+'">'+(owned?'ĐÃ MUA':'MUA')+'</button></div></div>'}).join('')+'</main>'+nav('phone')}
function life(){return '<main class="simplePage"><div class="pageHead"><div><b>❤️ Đời sống</b><div class="sub">Những con số chỉ mô tả cuộc sống, không phải điểm số để thắng.</div></div><button class="btn" data-nav="home">Đóng</button></div>'+lifeCard('😊 Hạnh phúc',state.happiness)+lifeCard('❤️ Sức khỏe',state.health)+lifeCard('⚡ Năng lượng',state.energy)+lifeCard('📱 MXH',state.social)+'<div class="card"><b>📚 Kiến thức '+state.knowledge+'</b><div class="muted">Đi học, tự học và trải nghiệm làm việc đều có thể thay đổi kiến thức.</div></div></main>'+nav('life')}
function lifeCard(n,v){return '<div class="card"><div class="step"><b>'+n+'</b><b>'+v+'/100</b></div><div class="bar"><i style="width:'+v+'%"></i></div></div>'}
function social(){
var posts=[
 {name:'Hương',time:'2 giờ',text:'Lại một ngày đi làm và deadline cổ lên tiếng. Có những hôm về tới phòng chỉ muốn nằm im.',img:img.room,react:'1,2K',comments:'86',comment:'Việt: “Mai vẫn đi làm chứ?”'},
 {name:'Đội Sinh Viên',time:'5 giờ',text:'Mai bắt đầu cuộc sống mới. Ngày thứ 427 của nó. Vẫn chưa biết “ổn định” là nghề gì.',img:img.school,react:'3,4K',comments:'212',comment:'Nguyễn Xíu: “Tôi cũng đang tìm định nghĩa.”'},
 {name:'Tin nóng 24h',time:'6 giờ',text:'Giá phòng trọ khu trung tâm lại tiếp tục tăng. Chủ trọ nói: “Do thị trường”.',img:img.street,react:'2,1K',comments:'340',comment:'Một người thuê trọ: “Thị trường có trả tiền giúp tôi không?”'},
 {name:'Tuyển dụng',time:'1 ngày',text:'Môi trường trẻ trung, năng động. Lương trao đổi khi phỏng vấn. Có cơ hội học hỏi và phát triển.',img:img.office,react:'892',comments:'124',comment:'Ẩn danh: “Cụm từ này nghe quen quá.”'},
 {name:'Meme mỗi ngày',time:'1 ngày',text:'Sinh viên kiểu: 5:00 dậy sớm. 5:01: ngủ tiếp để bảo vệ sức khỏe.',img:img.pho,react:'4,8K',comments:'306',comment:'Hương: “Ít nhất cũng thành thật.”'}
];
var p=posts[state.socialIndex%posts.length];
return '<main class="social"><div class="socialApp"><div class="socialTop"><b>mạng xã hội</b><div style="display:flex;gap:7px"><div class="circle">⌕</div><div class="circle">☰</div></div></div><div class="stories">'+posts.slice(0,5).map(function(s,i){return '<div class="story"><div class="storyImg"><img src="'+s.img+'"></div><small>'+s.name+'</small></div>'}).join('')+'</div><div class="timeline"><div class="autoNote">Bảng tin tự trôi · bài tiếp theo sau <span id="socialTimer">7</span>s</div>'+posts.map(function(x,i){return '<article class="fbpost" data-post="'+i+'"><div class="fbhead"><img class="fbavatar" src="'+(i%2?img.khoa:img.player)+'"><div><div class="fbname">'+x.name+' · <span style="font-weight:500;color:#1877f2">Theo dõi</span></div><div class="fbtime">'+x.time+' · 🌐</div></div><div class="fbmenu">•••</div></div><div class="fbtext">'+x.text+'</div><img class="fbimg" src="'+x.img+'"><div class="fbstats">👍 ❤️ 😂 &nbsp; '+x.react+' &nbsp; · &nbsp; '+x.comments+' bình luận</div><div class="fbactions"><span>👍 Thích</span><span>💬 Bình luận</span><span>↗ Chia sẻ</span></div><div class="fbcomment"><b>Một bình luận</b><br>'+x.comment+'</div></article>'}).join('')+'</div></div><button class="socialClose" data-act="closeSocial">ĐÓNG</button></main>'}
function more(){return '<main class="simplePage"><div class="pageHead"><div><b>☰ Thêm</b><div class="sub">Các chức năng phụ của cuộc sống.</div></div><button class="btn" data-nav="home">Đóng</button></div><div class="card"><button class="btn full" data-act="messages">💬 Tin nhắn</button><button class="btn full" style="margin-top:7px" data-act="schedule">📅 Lịch</button><button class="btn full" style="margin-top:7px" data-act="reset">♻️ Chơi lại</button></div></main>'+nav('more')}
function messages(){return '<main class="simplePage"><div class="pageHead"><div><b>💬 Tin nhắn</b></div><button class="btn" data-nav="more">Đóng</button></div><div class="card"><b>Mẹ</b><div class="muted" style="margin-top:5px">Dạo này con có vui không?</div><button class="btn choice" data-act="msgGood">Dạ con ổn mà mẹ.</button><button class="btn choice" data-act="msgHonest">Con cũng không biết.</button><button class="btn choice" data-act="msgTry">Con đang cố.</button></div></main>'+nav('more')}
function render(){clearInterval(timer);clearInterval(dialogueTimer);var s=state.screen;var html=s==='home'?home():s==='phone'?phone():s==='jobs'?jobs():s==='travel'?travel(state.travel.kind):s==='schoolTravel'?schoolTravel():s==='job'?jobScreen():s==='shop'?shop():s==='life'?life():s==='social'?social():s==='more'?more():messages();root.innerHTML=html;bind();if(s==='travel'||s==='schoolTravel')startTravelTimer();if(s==='social')startSocialTimer()}
function bind(){root.querySelectorAll('[data-nav]').forEach(function(b){b.onclick=function(){state.screen=b.dataset.nav;render()}});root.querySelectorAll('[data-act]').forEach(function(b){b.onclick=function(){act(b.dataset.act)}});root.querySelectorAll('[data-start]').forEach(function(b){b.onclick=function(){chooseJob(b.dataset.start)}});root.querySelectorAll('[data-buy]').forEach(function(b){b.onclick=function(){buy(b.dataset.buy)}})}
function chooseJob(k){state.jobRun={kind:k,step:0,progress:0,running:false};state.screen='travel';state.travel={kind:k,started:Date.now(),duration:state.inventory.indexOf('bike')>=0?50:90};render()}
function startTravelTimer(){clearInterval(timer);clearInterval(dialogueTimer);var travelLines=['Một chiếc xe máy bóp còi ngay phía sau.','Hương nhìn sang: “Hôm nay trông cậu tỉnh táo đấy.”','Một bác xe ôm: “Đi làm sớm thế cháu?”','Một nhóm sinh viên chạy vội qua đường.','Quán cà phê bên đường vừa mở cửa.'];var idx=0;dialogueTimer=setInterval(function(){idx++;var b=document.getElementById('travelDialogue');var e=document.getElementById('travelEvent');if(b)b.innerHTML='<b>Trên đường</b><br>'+travelLines[idx%travelLines.length];if(e)e.textContent='👀 '+travelLines[idx%travelLines.length]},3000);timer=setInterval(function(){if(!state.travel)return;var elapsed=(Date.now()-state.travel.started)/1000;var pct=Math.min(100,elapsed/state.travel.duration*100);var p=document.getElementById('travelProgress');if(p)p.style.width=pct+'%';var t=document.getElementById('travelTime');if(t)t.textContent=Math.max(0,Math.ceil(state.travel.duration-elapsed))+'s';if(elapsed>=state.travel.duration){clearInterval(timer);clearInterval(dialogueTimer);finishTravel()}},250)}
function finishTravel(){var k=state.travel.kind;state.travel=null;state.screen='job';state.jobRun={kind:k,step:0,progress:0,running:false};addTime(.5);save();render()}
function startSchool(){state.travel={kind:'school',started:Date.now(),duration:state.inventory.indexOf('bike')>=0?40:60};state.screen='schoolTravel';render()}
function finishSchool(){state.travel=null;state.screen='home';state.knowledge+=2;state.energy=clamp(state.energy-5);addTime(1.5);save();toast('Đã vào lớp · +2 kiến thức');render()}
function startSocialTimer(){clearInterval(timer);var n=7;var el=document.getElementById('socialTimer');var wrap=document.querySelector('.socialApp');timer=setInterval(function(){n--;if(el)el.textContent=Math.max(0,n);if(n<=0){state.socialIndex++;addTime(.12);save();clearInterval(timer);render();setTimeout(function(){var cards=document.querySelectorAll('.fbpost');var c=cards[state.socialIndex%cards.length];if(c)c.scrollIntoView({behavior:'smooth',block:'center'})},40)}},1000)}
function jobDo(){if(!state.jobRun||state.jobRun.running)return;state.jobRun.running=true;state.jobRun.progress=0;render();clearInterval(timer);var duration=state.jobRun.kind==='office'?220:180;timer=setInterval(function(){state.jobRun.progress+=100/(duration/140);var p=document.getElementById('jobProgress');if(p)p.style.width=Math.min(100,state.jobRun.progress)+'%';if(state.jobRun.progress>=100){clearInterval(timer);state.jobRun.running=false;state.jobRun.progress=0;state.jobRun.step++;if(state.jobRun.step>=steps[state.jobRun.kind].length){finishJob()}else{save();render()}}},140)}
function finishJob(){var k=state.jobRun.kind;var gain=k==='pho'?35000:k==='office'?90000:30000;state.money+=gain;state.job=k==='pho'?'Phục vụ quán phở':k==='office'?'Nhân viên văn phòng':'Shipper';addTime(k==='office'?2:.75);state.energy=clamp(state.energy-(k==='office'?12:8));state.happiness=clamp(state.happiness+1);state.jobRun=null;save();toast('Ca làm hoàn tất · +'+money(gain));setTimeout(function(){state.screen='home';render()},650)}
function buy(id){var prices={shirt:80000,phone2:1500000,laptop:4000000,bag:150000,bike:1200000,fridge:4000000};if(state.inventory.indexOf(id)>=0){toast('Bạn đã mua món này.');return}if(state.money<prices[id]){toast('Chưa đủ tiền.');return}state.money-=prices[id];state.inventory.push(id);save();toast('Đã mua.');render()}
function act(a){if(a==='school'){startSchool();return}if(a==='work'){state.screen='jobs';render();return}if(a==='sleep'){addTime(2);state.energy=clamp(state.energy+30);state.health=clamp(state.health+2);save();toast('Bạn ngủ thêm 2 giờ.');render();return}if(a==='study'){addTime(1);state.knowledge+=2;state.energy=clamp(state.energy-10);save();toast('Học xong · +2 kiến thức');render();return}if(a==='phone'){state.screen='phone';render();return}if(a==='shop'){state.screen='shop';render();return}if(a==='jobs'){state.screen='jobs';render();return}if(a==='social'){state.screen='social';render();return}if(a==='closeSocial'){state.screen='phone';render();return}if(a==='cancelTravel'){state.travel=null;state.screen='home';clearInterval(timer);render();return}if(a==='skipTravel'){finishTravel();return}if(a==='skipSchool'){finishSchool();return}if(a==='jobDo'){jobDo();return}if(a==='cancelJob'){state.jobRun=null;state.screen='home';clearInterval(timer);toast('Bạn đã hủy ca.');render();return}if(a==='messages'){state.screen='messages';render();return}if(a==='msgGood'){state.happiness=clamp(state.happiness+2);save();toast('Mẹ: Nhớ ăn uống nhé.');render();return}if(a==='msgHonest'){state.happiness=clamp(state.happiness-1);save();toast('Mẹ im lặng một lúc…');render();return}if(a==='msgTry'){save();toast('Mẹ: Cố nhưng nhớ nghỉ.');render();return}if(a==='schedule'){toast('08:00 học · 14:00 học · lịch có thể xung đột ca làm.');return}if(a==='wallet'){toast('Ví: '+money(state.money));return}if(a==='map'){toast('Phòng · trường · phở · văn phòng · shipper · shop.');return}if(a==='profile'){toast(state.name+' · 18 tuổi');return}if(a==='settings'){toast('Tự lưu đang bật · NEW HOST 1.2 · WORLD UPDATE');return}if(a==='reset'){try{localStorage.removeItem('DNCSV_NEW_HOST_1_2')}catch(e){}location.reload();return}}
function bootGame(){try{load();render();boot.style.display='none'}catch(e){console.error(e);bootError.style.display='block';bootError.textContent='Lỗi khởi động: '+(e&&e.message?e.message:String(e))}}
window.addEventListener('error',function(e){console.error(e.error||e.message);if(bootError){bootError.style.display='block';bootError.textContent='Lỗi runtime: '+(e&&e.message?e.message:'Không xác định')}});window.addEventListener('unhandledrejection',function(e){console.error(e.reason);if(bootError){bootError.style.display='block';bootError.textContent='Lỗi Promise: '+(e&&e.reason?String(e.reason):'Không xác định')}});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootGame,{once:true});else bootGame();
})();
</script>
