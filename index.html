<script>
const ASSETS={};
function loadEmbeddedAssets(){
  const el=document.getElementById("embeddedAssets");
  if(!el) throw new Error("Không tìm thấy kho asset nhúng");
  const raw=el.textContent||"";
  if(!raw.trim()) throw new Error("Kho asset nhúng đang trống");
  Object.assign(ASSETS,JSON.parse(raw));
  if(Object.keys(ASSETS).length<30) throw new Error("Thiếu asset nhúng: "+Object.keys(ASSETS).length+"/33");
}

const asset=(name)=>ASSETS[String(name).replace(/\.(png|webp)$/i,'.webp')]||'';
const KEY='DNCSV_BIG_4_1';'DNCSV_BIG_4_1';
let S=null, screen='home', travel=null, job=null, socialIndex=0, socialTimer=null, jobInterval=null, travelInterval=null;
const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,Number.isFinite(Number(n))?Number(n):a));
const money=n=>Math.max(0,Math.round(Number(n)||0)).toLocaleString('vi-VN')+'đ';
function safeGet(){try{return window.localStorage?window.localStorage.getItem(KEY):null}catch(e){return null}}
function safeSet(v){try{if(window.localStorage)window.localStorage.setItem(KEY,v);return true}catch(e){return false}}
const save=()=>safeSet(JSON.stringify(S));
function toast(t){const e=document.getElementById('toast');if(!e)return;e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2100)}
function transition(t,fn){const f=document.getElementById('fade');if(!f){fn();return}document.getElementById('fadeText').textContent=t;f.classList.add('on');setTimeout(()=>{fn();setTimeout(()=>f.classList.remove('on'),160)},220)}
function initState(){return {day:2,weekday:'Thứ 3',hour:6,minute:0,name:'Phương',gender:'male',money:500000,health:88,energy:95,happiness:70,knowledge:11,social:15,debt:0,job:'Chưa chọn',inventory:[],personality:{humor:50,ambition:50,sensitivity:50,confidence:50,empathy:50,sociality:50},seen:[],stats:{work:0,school:0,socialTime:0},relationships:{huong:2,khoa:1,mother:4},memories:[],eventLog:[],storyFlags:[],currentEvent:null}}
function normalize(x){const d=initState();x=(x&&typeof x==='object')?x:{};const out={...d,...x};out.personality={...d.personality,...(x.personality||{})};out.inventory=Array.isArray(x.inventory)?x.inventory:[];out.seen=Array.isArray(x.seen)?x.seen:[];out.stats={...d.stats,...(x.stats||{})};out.relationships={...d.relationships,...(x.relationships||{})};out.memories=Array.isArray(x.memories)?x.memories:[];out.eventLog=Array.isArray(x.eventLog)?x.eventLog:[];out.storyFlags=Array.isArray(x.storyFlags)?x.storyFlags:[];out.currentEvent=x.currentEvent||null;return out}
function load(){try{const raw=safeGet();S=raw?normalize(JSON.parse(raw)):initState()}catch(e){S=initState()}save()}
function timeAdd(hours){let mins=Math.round(hours*60);S.minute+=mins;S.hour+=Math.floor(S.minute/60);S.minute%=60;while(S.hour>=24){S.hour-=24;S.day++;S.energy=clamp(S.energy+55);S.health=clamp(S.health-2);S.happiness=clamp(S.happiness-1);S.money=Math.max(0,S.money-30000)}S.energy=clamp(S.energy-Math.round(hours*7));save()}
function clock(){return String(S.hour).padStart(2,'0')+':'+String(S.minute).padStart(2,'0')}
function nav(active){return `<nav class="bottom"><button data-nav="home" class="${active==='home'?'active':''}"><span class="ico">🏠</span>Nhà</button><button data-nav="phone" class="${active==='phone'?'active':''}"><span class="ico">📱</span>Điện thoại</button><button data-nav="life" class="${active==='life'?'active':''}"><span class="ico">❤️</span>Đời sống</button><button data-nav="more" class="${active==='more'?'active':''}"><span class="ico">☰</span>Thêm</button></nav>`}
function top(){return `<header class="top"><div class="brand">ĐỜI NÀY CÓ GÌ VUI?</div><div class="sub">Ngày ${S.day} · ${S.weekday} · ${S.name}, 18 tuổi · ${clock()}</div><div class="hud"><div class="stat"><div class="label">💰 Tiền</div><b>${money(S.money)}</b></div><div class="stat"><div class="label">❤️ Sức khỏe</div><b>${S.health}/100</b><div class="bar"><i style="width:${S.health}%"></i></div></div><div class="stat"><div class="label">⚡ Năng lượng</div><b>${S.energy}/100</b><div class="bar"><i style="width:${S.energy}%"></i></div></div></div></header>`}
function scene(id,label,bg,player='idle',extra=''){const p=player==='work'?'anim_pho_work.png':'char_player_male.png';return `<div class="scene"><img class="bg" src="${asset(bg)}"><div class="tag">${label}</div><img class="player ${player==='work'?'work':''}" src="${asset(p)}">${extra}</div>`}
function home(){return `${top()}<main class="screen"><div class="content">${scene('room','🏠 PHÒNG TRỌ · CẤP 1','map_phong_tro.png','idle',`<div class="bubble"><b>PHÒNG TRỌ</b>Nơi mọi lựa chọn bắt đầu. Bạn có thể học, nghỉ, ăn, dùng điện thoại hoặc đi làm.</div>`)}<section class="panel"><h2>Hôm nay bạn muốn làm gì?</h2><div class="actions"><button class="btn" data-act="school">🏫 Đi học</button><button class="btn" data-act="work">💼 Đi làm</button><button class="btn" data-act="sleep">😴 Ngủ / nghỉ</button><button class="btn" data-act="study">📚 Học</button><button class="btn" data-act="phone">📱 Dùng điện thoại</button><button class="btn" data-act="shop">🛒 Mua đồ</button></div></section><section class="panel"><h2>Cuộc sống hiện tại</h2><div class="muted">📚 Kiến thức ${S.knowledge} · 😊 Hạnh phúc ${S.happiness}/100 · 📱 MXH ${S.social}/100 · 💼 ${S.job}</div></section></div></main>${nav('home')}<div class="build">FULL BUILD 4.2 · 11 MODULES</div>`}
function phone(){return `<div class="phone"><div class="phoneHeader"><div><b>📱 Điện thoại</b><div class="sub">${clock()} · pin 85%</div></div><button class="btn" data-nav="home">Đóng</button></div><div class="phoneGrid"><button class="app" data-act="jobs"><span>💼</span>Xin việc</button><button class="app" data-act="shop"><span>🛒</span>Cửa hàng</button><button class="app" data-act="social"><span>🌐</span>Mạng xã hội</button><button class="app" data-act="messages"><span>💬</span>Tin nhắn</button><button class="app" data-act="schedule"><span>📅</span>Lịch</button><button class="app" data-act="wallet"><span>💳</span>Ví tiền</button><button class="app" data-act="map"><span>🗺️</span>Bản đồ</button><button class="app" data-act="profile"><span>👤</span>Nhân vật</button><button class="app" data-act="settings"><span>⚙️</span>Cài đặt</button></div><section class="panel"><h2>Điện thoại là một scene riêng</h2><div class="muted">Công việc, shop, social và tin nhắn mở từ đây. Không dùng popup đè lên phòng.</div></section></div>${nav('phone')}<div class="build">FULL BUILD 4.2 · 11 MODULES</div>`}

function social(){const p=posts[Math.max(0,Math.min(posts.length-1,socialIndex%posts.length))];return `<div class="feed"><div class="feedHead"><b>🌐 ĐờiBook</b><span>VUỐT ↑ / ↓</span></div><article class="post"><div class="postHead"><img class="avatar" src="${asset(p[2])}"><div>${p[0]}<div class="muted">vừa đăng</div></div></div><img class="postArt" src="${asset('map_phong_tro.png')}"><div class="postText"><b>${p[3]} </b>${p[1]}</div><div class="postFoot">♥ ${900+socialIndex*211} · 💬 ${70+socialIndex*27}</div></article><button class="socialClose" data-act="closeSocial">ĐÓNG</button></div>`}
function jobCard(id,ico,name,pay,desc){return `<article class="jobCard"><div class="jobCardTop"><div class="jobIcon">${ico}</div><div><h3>${name}</h3><div class="pay">${pay}</div><div class="desc">${desc}</div></div></div><button class="btn primary" style="width:100%;margin-top:9px" data-start="${id}">NHẬN CA → DI CHUYỂN</button></article>`}
function travelScreen(){let labels={pho:'🍜 Đang tới quán phở',office:'🧑‍💻 Đang tới văn phòng',ship:'🛵 Đang tới khu shipper'};let route=travel.kind;let duration=travel.transport==='walk'?90:travel.transport==='bike'?50:25;let pct=Math.min(100,Math.round((Date.now()-travel.started)/1000/duration*100));return `${top()}<main class="screen"><div class="content"><div class="scene travel"><img class="bg" src="${asset('map_duong_pho.png')}"><div class="tag">🌆 ĐƯỜNG PHỐ</div><img class="player" src="${asset('anim_walk.png')}" style="height:145px;bottom:95px"><div class="route"><div class="routeTitle">${labels[route]}</div><div class="routeMeta">${travel.transport==='walk'?'Đi bộ · 01:30':travel.transport==='bike'?'Xe đạp · 00:50':'Xe máy · 00:25'}</div><div class="travelBar"><i style="width:${pct}%"></i></div><div class="muted">NPC đi ngang, xe cộ và hội thoại ngắn xuất hiện trong lúc di chuyển.</div><div class="muted" style="margin-top:8px">Nhân vật tự đi tới điểm đến. Không cần bấm.</div></div></div></div></main>`}
function jobScreen(){let map=job.kind==='pho'?'map_quan_pho.png':job.kind==='office'?'map_van_phong.png':'map_khu_shipper.png';let label=job.kind==='pho'?'🍜 QUÁN PHỞ':job.kind==='office'?'🧑‍💻 VĂN PHÒNG':'🛵 KHU SHIPPER';let anim=job.kind==='pho'?'anim_pho_work.png':job.kind==='office'?'anim_office_work.png':'anim_delivery.png';let step=job.steps[job.step];let left=Math.max(0,300-Math.floor((Date.now()-job.started)/1000));let mm=String(Math.floor(left/60)).padStart(2,'0'),ss=String(left%60).padStart(2,'0');return `${top()}<main class="screen"><div class="content"><div class="scene jobScene"><img class="bg" src="${asset(map)}"><div class="tag">${label}</div><img class="player work" src="${asset(anim)}"><div class="bubble"><b>${job.title}</b>${step.text}</div></div><section class="jobPanel"><div class="orderHead"><div><b>${step.name}</b><div class="muted">${job.detail}</div></div><span class="pill">CA CÒN ${mm}:${ss}</span></div><div class="progress"><i style="width:${job.progress}%"></i></div><div class="jobActions"><button class="btn primary main" id="jobDo">${job.running?'ĐANG LÀM…':'▶ '+step.action}</button><button class="btn" data-act="jobHelp">ℹ HƯỚNG DẪN</button></div><div class="stepNote">⏱ Ca làm kéo dài đúng 5 phút. HOME đang KHÓA cho tới khi ca kết thúc. Hoàn thành bước để tăng hiệu suất; tiền nhận sau khi hết ca.</div></section></div></main>`}
function startJobClock(){clearInterval(jobInterval);jobInterval=setInterval(()=>{if(!job)return;let elapsed=(Date.now()-job.started)/1000;if(elapsed>=300){clearInterval(jobInterval);finishJob()}else{const pill=document.querySelector('.pill');if(pill){let left=Math.max(0,300-Math.floor(elapsed));pill.textContent='CA CÒN '+String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}}},500)}
function advanceJobStep(){if(!job||job.running)return;job.running=true;job.progress=0;render();clearInterval(jobInterval);jobInterval=setInterval(()=>{if(!job)return;job.progress=Math.min(100,job.progress+10);const bar=document.querySelector('.progress i');if(bar)bar.style.width=job.progress+'%';if(job.progress>=100){clearInterval(jobInterval);job.running=false;job.step=(job.step+1)%job.steps.length;job.completedActions=(job.completedActions||0)+1;job.performance=Math.min(100,(job.performance||0)+6);save();render();startJobClock()}},1000);startJobClock()}
function finishJob(){if(!job)return;clearInterval(jobInterval);let base=job.kind==='pho'?80000:job.kind==='office'?90000:75000;let bonus=Math.round(base*((job.performance||0)/100)*0.15);let gain=base+bonus;S.money+=gain;S.stats.work++;S.job=job.kind==='pho'?'Phục vụ quán phở':job.kind==='office'?'Nhân viên văn phòng':'Shipper';S.energy=clamp(S.energy-15);S.happiness=clamp(S.happiness+1);S.memories.push({id:'job_'+job.kind+'_shift_'+S.day+'_'+S.stats.work,day:S.day,text:'Hoàn thành một ca '+S.job});lastJobSummary={gain,performance:job.performance||0,kind:job.kind};job=null;save();toast('Hết ca 5 phút · +'+money(gain)+' · HOME đã mở');screen='jobSummary';render()}
function startSchoolTravel(){travel={kind:'school',transport:S.inventory.includes('bike')?'bike':'walk',started:Date.now()};screen='schoolTravel';render();clearInterval(travelInterval);travelInterval=setInterval(()=>{if(!travel)return;let duration=travel.transport==='walk'?60:travel.transport==='bike'?40:20;if(Date.now()-travel.started>=duration*1000){clearInterval(travelInterval);finishSchoolTravel()}else{const r=document.querySelector('.travelBar i');if(r)r.style.width=Math.min(100,((Date.now()-travel.started)/1000/duration*100))}},500)}
function finishSchoolTravel(){travel=null;clearInterval(travelInterval);S.stats.school++;timeAdd(1.5);S.knowledge+=2;S.energy=clamp(S.energy-5);save();toast('Vào lớp · +2 kiến thức');screen='home';render();maybeEvent('after_school')}
function schoolTravelScreen(){return `${top()}<main class="screen"><div class="content"><div class="scene travel"><img class="bg" src="${asset('map_duong_pho.png')}"><div class="tag">🌆 ĐƯỜNG PHỐ · TỚI TRƯỜNG</div><img class="player" src="${asset('anim_walk.png')}" style="height:145px;bottom:95px"><div class="route"><div class="routeTitle">🏫 Đang tới trường học</div><div class="routeMeta">${travel.transport==='walk'?'Đi bộ · 01:00':travel.transport==='bike'?'Xe đạp · 00:40':'Xe máy · 00:20'}</div><div class="travelBar"><i style="width:${Math.min(100,Math.round((Date.now()-travel.started)/1000/(travel.transport==='walk'?60:travel.transport==='bike'?40:20)*100))}%"></i></div><div class="muted">Trên đường có NPC, xe cộ và các đoạn hội thoại ngắn.</div></div></div></div></main>`}
function startTravel(kind){travel={kind,transport:S.inventory.includes('bike')?'bike':'walk',started:Date.now()};screen='travel';render();clearInterval(travelInterval);travelInterval=setInterval(()=>{if(!travel)return;let duration=travel.transport==='walk'?90:travel.transport==='bike'?50:25;if(Date.now()-travel.started>=duration*1000){clearInterval(travelInterval);finishTravel()}else{const r=document.querySelector('.travelBar i');if(r)r.style.width=Math.min(100,((Date.now()-travel.started)/1000/duration*100))}},500)}
function finishTravel(){if(!travel)return;let k=travel.kind;travel=null;clearInterval(travelInterval);job={kind:k,step:0,progress:0,running:false,started:Date.now(),performance:0,completedActions:0,detail:k==='pho'?'Order #101 · Phở bò + quẩy':k==='office'?'Task #204 · Nhập dữ liệu':'Đơn #782 · Chung cư A · Tầng 7',title:k==='pho'?'PHỤC VỤ':k==='office'?'VĂN PHÒNG':'SHIPPER',steps:k==='pho'?[
{name:'NHẬN ORDER',action:'NHẬN ORDER',text:'Khách vừa gọi món. Chọn nhận để bắt đầu.'},{name:'CHUẨN BỊ MÓN',action:'LÀM MÓN',text:'Đang chuẩn bị. Có thể hủy ca giữa chừng.'},{name:'MANG MÓN',action:'MANG MÓN',text:'Món xong. Đưa tới đúng bàn.'},{name:'DỌN BÀN',action:'DỌN BÀN',text:'Khách đã ăn xong. Dọn bàn.'},{name:'THU TIỀN',action:'THU TIỀN',text:'Bấm thu tiền mới nhận tiền.'}]:k==='office'?[{name:'NHẬN TASK',action:'NHẬN TASK',text:'Sếp vừa giao một việc rất đơn giản.'},{name:'LÀM VIỆC',action:'LÀM VIỆC',text:'Gõ máy, kiểm tra file và chịu đựng.'},{name:'CHECK',action:'CHECK',text:'Rà lại một vòng.'},{name:'SUBMIT',action:'SUBMIT',text:'Nộp task.'},{name:'NHẬN LƯƠNG',action:'NHẬN LƯƠNG',text:'Tiền công được cộng ở bước cuối.'}]:[{name:'NHẬN ĐƠN',action:'NHẬN ĐƠN',text:'Có đơn mới.'},{name:'LẤY HÀNG',action:'LẤY HÀNG',text:'Đang lấy hàng.'},{name:'DI CHUYỂN',action:'ĐI GIAO',text:'Không cần lái xe thủ công.'},{name:'GIAO HÀNG',action:'GIAO HÀNG',text:'Khách nhận hàng.'},{name:'XÁC NHẬN',action:'XÁC NHẬN',text:'Hoàn tất đơn.'}]};screen='job';render();startJobClock()}

const EVENT_POOL=[
{id:'rent_tension',trigger:'after_work',title:'Tiền trọ lại tới',text:'Chủ trọ nhắn: “Mai nhớ tiền phòng nhé em.” Ví còn không nhiều.',once:false,choices:[['Ăn uống tiết kiệm vài hôm','money',5000],['Thôi kệ, mai tính','happy',-1]]},
{id:'huong_cafe',trigger:'after_work',title:'Hương nhắn tin',text:'“Tan ca chưa? Ra đầu ngõ uống nước không?”',once:false,choices:[['Đi một lát','rel',1],['Hôm nay mệt rồi','energy',8]]},
{id:'street_expert',trigger:'random',title:'Chuyên gia ven đường',text:'Một anh lạ mặt nói: “Muốn thành công phải dậy từ 5 giờ sáng.”',once:false,choices:[['Gật gù','happy',1],['Tôi dậy 5 giờ để ngủ tiếp','humor',2]]},
{id:'mom_call',trigger:'random',title:'Mẹ gọi',text:'“Dạo này con có vui không?”',once:false,choices:[['Dạ con ổn','happy',2],['Con đang cố','rel',1]]}
];
function maybeEvent(trigger){if(S.currentEvent)return;let pool=EVENT_POOL.filter(e=>(e.trigger===trigger||e.trigger==='random')&&(!e.once||!S.seen.includes(e.id)));if(!pool.length)return;if(Math.random()>(trigger==='after_work'?0.55:0.18))return;let e=pool[Math.floor(Math.random()*pool.length)];S.currentEvent=e.id;save();setTimeout(()=>{screen='event';render()},250)}
function eventScreen(){let e=EVENT_POOL.find(x=>x.id===S.currentEvent);if(!e){screen='home';return home()}return `${top()}<main class="screen"><div class="content"><section class="event"><h3>🎲 ${e.title}</h3><div class="muted">${e.text}</div>${e.choices.map((c,i)=>`<button class="choice" data-event-choice="${i}">${c[0]}</button>`).join('')}</section></div></main>`}
function resolveEvent(i){let e=EVENT_POOL.find(x=>x.id===S.currentEvent);if(!e)return;let c=e.choices[i];if(!c)return;if(c[1]==='money')S.money+=c[2];if(c[1]==='happy')S.happiness=clamp(S.happiness+c[2]);if(c[1]==='energy')S.energy=clamp(S.energy+c[2]);if(c[1]==='rel')S.relationships.huong=Math.min(5,(S.relationships.huong||0)+c[2]);if(c[1]==='humor')S.personality.humor=clamp(S.personality.humor+c[2]);S.seen.push(e.id);S.eventLog.push({id:e.id,day:S.day});S.currentEvent=null;save();toast('Lựa chọn đã ghi nhớ.');screen='home';render()}
function relationships(){let people=[['huong','Hương','☕','Bạn học · hay rủ đi uống nước'],['khoa','Khoa','🧑‍💻','Bạn cùng lớp · nói chuyện thẳng'],['mother','Mẹ','🏠','Gia đình · luôn hỏi “con có vui không?”']];return `${top()}<main class="screen"><div class="content"><section class="panel"><h2>❤️ CÁC MỐI QUAN HỆ</h2><div class="muted">Không có thanh “tình cảm” lộ liễu. Trạng thái thay đổi qua lời nói, ký ức và những lần gặp lại.</div></section>${people.map(p=>{let v=S.relationships[p[0]]||0;let state=v<2?'Chưa thân':v===2?'Quen':v===3?'Bạn':v===4?'Thân':'Rất thân';return `<article class="lifeCard"><h3>${p[2]} ${p[1]} <span style="float:right">${state}</span></h3><div class="muted">${p[3]}</div><div class="bar"><i style="width:${v/5*100}%"></i></div></article>`}).join('')}<section class="panel"><h2>🧠 Ký ức gần đây</h2>${S.memories.slice(-5).reverse().map(m=>`<div class="lifeRow"><span>Ngày ${m.day}</span><b>${m.text}</b></div>`).join('')||'<div class="muted">Chưa có ký ức đặc biệt.</div>'}</section></div></main>${nav('life')}`}
let lastJobSummary=null;
function jobSummary(){let g=lastJobSummary;if(!g){screen='home';return home()}return `${top()}<main class="screen"><div class="content"><section class="panel"><h2>✅ CA LÀM HOÀN TẤT</h2><div class="event"><h3>5 phút đã xong.</h3><div class="muted">Hiệu suất: ${g.performance}%</div><div style="font-size:24px;font-weight:950;margin-top:8px">+${money(g.gain)}</div></div><button class="btn good" style="width:100%;margin-top:10px" data-act="goHomeAfterJob">🏠 VỀ NHÀ</button></section></div></main>`}
function shop(){let items=[['shirt','👕','Áo thun',80000,'Đổi trang phục'],['phone2','📱','Điện thoại mới',1500000,'Mở thêm trải nghiệm phone'],['laptop','💻','Laptop cũ',4000000,'Mở học/làm việc sâu hơn'],['bag','🎒','Ba lô',150000,'Đi học gọn hơn'],['bike','🚲','Xe đạp',1200000,'Rút travel còn 00:50'],['fridge','🧊','Tủ lạnh',4000000,'Mở hoạt động nấu ăn']];return `${top()}<main class="screen"><div class="content"><section class="panel"><h2>🛒 CỬA HÀNG</h2><div class="muted">Mua đồ là lựa chọn cuộc sống: có món chỉ để đẹp, có món mở nội dung, có món mua lại thời gian.</div></section><div class="shopGrid">${items.map(i=>`<article class="shopCard"><div class="shopIcon">${i[1]}</div><h3>${i[2]}</h3><div class="desc">${i[4]}</div><div class="price">${money(i[3])}</div><button class="btn ${S.inventory.includes(i[0])?'good':''}" style="width:100%;margin-top:7px" data-buy="${i[0]}" data-price="${i[3]}" data-name="${i[2]}">${S.inventory.includes(i[0])?'ĐÃ MUA':'MUA'}</button></article>`).join('')}</div></div></main>${nav('home')}`}
function life(){return `${top()}<main class="screen"><div class="content"><section class="panel"><h2>❤️ ĐỜI SỐNG</h2><div class="lifeGrid">${[['Hạnh phúc',S.happiness],['Sức khỏe',S.health],['Năng lượng',S.energy],['📱 Ảnh hưởng MXH',S.social],['📚 Kiến thức',Math.min(100,S.knowledge)]].map(x=>`<div class="lifeCard"><h3>${x[0]} <span style="float:right">${x[1]}/100</span></h3><div class="bar"><i style="width:${Math.min(100,x[1])}%"></i></div></div>`).join('')}</div></section><section class="panel"><h2>🧠 Tính cách</h2><div class="muted">Hài hước ${S.personality.humor} · Tham vọng ${S.personality.ambition} · Nhạy cảm ${S.personality.sensitivity} · Đồng cảm ${S.personality.empathy}</div></section><section class="panel"><h2>❤️ Quan hệ & ký ức</h2><button class="btn primary" style="width:100%" data-act="relationships">MỞ MỐI QUAN HỆ</button><div class="muted" style="margin-top:7px">Đã ghi nhớ ${S.memories.length} khoảnh khắc · ${S.eventLog.length} sự kiện</div></section><section class="panel"><h2>📚 Tiến trình</h2><div class="muted">Đã đi làm ${S.stats.work} ca · Đã đi học ${S.stats.school} buổi · Nợ ${money(S.debt)}</div></section></div></main>${nav('life')}`}
function more(){return `${top()}<main class="screen"><div class="content"><section class="panel"><h2>☰ THÊM</h2><div class="actions"><button class="btn" data-act="messages">💬 Tin nhắn</button><button class="btn" data-act="schedule">📅 Lịch</button><button class="btn" data-act="profile">👤 Nhân vật</button><button class="btn" data-act="reset">♻️ Chơi lại</button></div></section><section class="event"><h3>“Không có cuộc đời hoàn hảo. Chỉ có cuộc đời do bạn chọn.”</h3><div class="muted">Các lựa chọn hôm nay có thể quay lại dưới dạng một cuộc trò chuyện, một bài đăng, một khoản tiền hoặc một ngày mệt.</div></section></div></main>${nav('more')}`}
function messages(){return `${top()}<main class="screen"><div class="content"><section class="event"><h3>💬 Mẹ</h3><div class="muted">Dạo này con có vui không?</div><button class="choice" data-act="msgGood">Dạ con ổn mà mẹ.</button><button class="choice" data-act="msgHonest">Con cũng không biết.</button><button class="choice" data-act="msgTry">Con đang cố.</button></section></div></main>${nav('more')}`}
function render(){clearInterval(socialTimer);let html=screen==='home'?home():screen==='phone'?phone():screen==='social'?social():screen==='jobs'?jobs():screen==='travel'?travelScreen():screen==='schoolTravel'?schoolTravelScreen():screen==='job'?jobScreen():screen==='jobSummary'?jobSummary():screen==='shop'?shop():screen==='life'?life():screen==='relationships'?relationships():screen==='event'?eventScreen():screen==='more'?more():messages();document.getElementById('game').innerHTML=html;bind()}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(job)return;screen=b.dataset.nav;render()});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{startTravel(b.dataset.start)});document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy,Number(b.dataset.price),b.dataset.name));document.querySelectorAll('[data-event-choice]').forEach(b=>b.onclick=()=>resolveEvent(Number(b.dataset.eventChoice)));const jd=document.getElementById('jobDo');if(jd)jd.onclick=doJob;const feed=document.querySelector('.feed');if(feed){let sy=0;feed.addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});feed.addEventListener('touchend',e=>{let dy=e.changedTouches[0].clientY-sy;if(Math.abs(dy)>35){socialIndex=Math.max(0,socialIndex+(dy<0?1:-1));render()}})}}
function act(a){
 if(job && a!=='jobDo' && a!=='jobHelp'){toast('Bạn đang trong ca 5 phút. HOME đang khóa.');return}
 if(a==='sleep'){timeAdd(2);S.energy=clamp(S.energy+30);S.health=clamp(S.health+2);save();toast('Bạn ngủ thêm 2 giờ.');render();return}
 if(a==='study'){timeAdd(1);S.knowledge+=2;S.stats.school++;S.energy=clamp(S.energy-10);save();toast('Học xong. +2 kiến thức.');render();return}
 if(a==='phone'){screen='phone';render();return}
 if(a==='shop'){screen='shop';render();return}
 if(a==='school'){startSchoolTravel();return}
 if(a==='work'){screen='jobs';render();return}
 if(a==='jobs'){screen='jobs';render();return}
 if(a==='social'){screen='social';render();return}
 if(a==='closeSocial'){clearInterval(socialTimer);S.stats.socialTime++;S.social=clamp(S.social+1);save();screen='phone';render();maybeEvent('random');return}
 if(a==='cancelTravel'){travel=null;clearInterval(travelInterval);screen='home';render();return}
 if(a==='cancelSchool'){travel=null;clearInterval(travelInterval);screen='home';render();return}
 if(a==='finishSchool'){finishSchoolTravel();return}
 if(a==='finishTravel'){finishTravel();return}
 if(a==='jobDo'){doJob();return}
 if(a==='jobHelp'){toast('Ca kéo dài đúng 5 phút. Bấm hành động, hoàn thành bước và tiếp tục cho tới khi hết giờ.');return}
 if(a==='relationships'){screen='relationships';render();return}
 if(a==='goHomeAfterJob'){screen='home';render();maybeEvent('after_work');return}
 if(a==='messages'){screen='messages';render();return}
 if(a==='msgGood'){S.happiness=clamp(S.happiness+2);timeAdd(.1);toast('Mẹ: “Ừ, nhớ ăn uống nhé.”');return}
 if(a==='msgHonest'){S.happiness=clamp(S.happiness-1);S.personality.sensitivity=clamp(S.personality.sensitivity+2);timeAdd(.1);toast('Mẹ im lặng một lúc…');render();return}
 if(a==='msgTry'){S.personality.ambition=clamp(S.personality.ambition+1);timeAdd(.1);toast('Mẹ: “Cố nhưng nhớ nghỉ.”');return}
 if(a==='schedule'){toast('08:00 học · 14:00 học · lịch có thể xung đột ca làm.');return}
 if(a==='wallet'){toast('Ví: '+money(S.money)+' · Nợ: '+money(S.debt));return}
 if(a==='map'){toast('Bản đồ: phòng · trường · phở · văn phòng · shipper · shop.');return}
 if(a==='profile'){toast(S.name+' · 18 tuổi · '+S.job);return}
 if(a==='settings'){toast('Tự lưu đang bật · Build FULL BUILD 4.2 · 11 MODULES');return}
 if(a==='reset'){try{localStorage.removeItem(KEY)}catch(e){}S=initState();save();screen='home';render();return}
}
function buy(id,price,name){if(S.inventory.includes(id)){toast('Bạn đã mua món này.');return}if(S.money<price){toast('Chưa đủ tiền.');return}S.money-=price;S.inventory.push(id);save();toast('Đã mua '+name);render()}
function boot(){
 const g=document.getElementById('game');
 try{loadEmbeddedAssets();load();render();if(!g.innerHTML.trim())throw new Error('Render không tạo giao diện');}
 catch(err){console.error('BOOT_ERROR',err);g.innerHTML='<div style=\"padding:24px;color:#fff;font-family:system-ui;background:#07121a;min-height:100dvh\"><div style=\"font-size:24px;font-weight:900\">ĐỜI NÀY CÓ GÌ VUI?</div><div style=\"margin-top:6px;color:#9fb0c5\">FULL BUILD 4.2 · 11 MODULES · SAFE BOOT</div><div style=\"margin-top:18px;padding:14px;border:1px solid #425977;border-radius:14px;background:#132235\"><b>Game gặp lỗi khởi động.</b><p style=\"font-size:12px;color:#b8c3d1\">'+String(err&&err.message||err).replace(/[<>]/g,'')+'</p><button onclick=\"location.reload()\" style=\"width:100%;padding:12px;border-radius:10px;border:1px solid #506a8b;background:#243b59;color:#fff;font-weight:800\">TẢI LẠI</button></div></div>';}
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot,{once:true});}else{boot();}setTimeout(()=>{const g=document.getElementById('game');if(g&&g.textContent.includes('Đang khởi động game')){g.innerHTML='<div style="padding:24px;color:#fff;font-family:system-ui;background:#07121a;min-height:100dvh"><div style="font-size:24px;font-weight:900">ĐỜI NÀY CÓ GÌ VUI?</div><div style="margin-top:12px;padding:14px;border:1px solid #8a5962;border-radius:14px;background:#1b1217"><b>Game chưa khởi động được.</b><p style="font-size:12px;color:#c8b8bd">Nếu màn hình này xuất hiện, JavaScript chưa được thực thi hoặc trang đang dùng file cũ.</p><button onclick="location.reload()" style="width:100%;padding:12px;border-radius:10px;border:1px solid #506a8b;background:#243b59;color:#fff;font-weight:800">TẢI LẠI</button></div></div>'; }},8000);
window.addEventListener('error',function(e){console.error('RUNTIME_ERROR',e.error||e.message);var g=document.getElementById('game');if(g && (!g.innerHTML || g.innerHTML.trim()==='')){g.innerHTML='<div style=\"padding:24px;color:white;font-family:system-ui;background:#07121a;min-height:100dvh\"><b>ĐỜI NÀY CÓ GÌ VUI?</b><p>Runtime error. Hãy tải lại trang.</p><small>FULL BUILD 4.2 · 11 MODULES</small></div>';}});
</script></body></html>
